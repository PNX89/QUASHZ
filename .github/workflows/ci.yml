name: CI

# Nothing here needs a credential and nothing here reaches a cloud account.
#
# The jobs arrive with the legs they check. This one runs the offline suite, which is what a
# stranger gets by cloning the repository and installing the dev group alone. The verdict needs
# scikit-learn, DuckDB and Hypothesis, and the vendor contract needs Soda, so those get their own
# jobs as they arrive rather than being folded in here where the boundary would stop being
# visible.
#
# NO `schedule:` ANYWHERE IN THIS REPOSITORY, and that is a rule rather than an omission. Every
# required job runs from committed captures. Re-verifying against the live publishers is one
# manually triggered workflow that is allowed to fail, because a red build caused by somebody
# else's outage teaches people to ignore red builds.
#
# Third-party actions are pinned by commit from the first one, with the version in a comment.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: lint, types and the offline suite
    uses: PNX89/.github/.github/workflows/checks.yml@v1
    with:
      python-versions: '["3.11", "3.12", "3.13"]'
      # scikit-learn 1.9 requires Python 3.11 or newer, which is what fixes the floor of this
      # matrix. It is synced here because mypy cannot check a file whose imports it cannot
      # resolve, not because the offline suite needs it, and test_scaffold.py asserts that the
      # suite genuinely stays on the other side of that line.
      sync-args: "--dev --group verdict"
      run-mypy: true

  # The suite that needs the measuring instruments. Its own job, because the offline suite above
  # has to keep working for somebody who cloned this and installed the dev group alone, and that
  # claim is worth nothing if the two are run by the same command.
  verdict:
    name: the splitter and the controls, against scikit-learn and DuckDB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: run the tests that need the instruments
        run: uv run --group verdict pytest tests_verdict -q

  # The verdict itself, re-issued rather than trusted. A committed measurement nobody regenerates
  # is a claim about a laptop, and this one carries a hash that a downstream repository checks.
  #
  # ONE THREAD, and the harness sets it before scikit-learn is imported. Measured on this frame:
  # 5.54 seconds per scoring with the default pool against 0.23 pinned to one thread, for an
  # identical AUC to four decimal places. The problem is small enough that thread coordination
  # costs more than the work.
  verdict-issued:
    name: the verdict, issued again from the committed corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: issue the verdict
        run: uv run --group verdict python scripts/measure_verdict.py
      - name: fail if any measured outcome or transcript has changed
        run: |
          # The whole directory, not just the summary. The transcript is what a reader reads,
          # and a correct summary beside a transcript describing a run that no longer happens is
          # exactly the drift this job exists to catch. `git status` as well as `git diff`,
          # because a diff says nothing about a file the harness newly created.
          git status --porcelain docs/evidence/verdict
          git diff --exit-code -- docs/evidence/verdict
          test -z "$(git status --porcelain docs/evidence/verdict)"
